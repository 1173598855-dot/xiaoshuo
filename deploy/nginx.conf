worker_processes auto;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  upstream xiaoyi_app {
    server app:4310;
  }

  server {
    listen 8080;
    server_name _;

    # The app owns static assets and SPA fallback. Nginx remains a small,
    # same-origin reverse proxy so browser requests and API calls share one
    # origin and the application can enforce its access token policy.
    client_max_body_size 8m;

    location / {
      proxy_pass http://xiaoyi_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
