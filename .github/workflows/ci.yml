name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run security:dependencies
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - name: Build container image
        run: docker build -t xiaoyi-novel-workbench:p0 .

  windows-release:
    name: Windows package and release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:dist
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyi-novel-workbench-windows
          path: release/XiaoyiNovelWorkbench-*-setup.exe
          if-no-files-found: error
      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $installer = Get-ChildItem -Path release -Filter 'XiaoyiNovelWorkbench-*-setup.exe' | Select-Object -First 1
          if (gh release view $tag 2>$null) {
            gh release upload $tag $installer.FullName --clobber
          } else {
            gh release create $tag $installer.FullName --title "小奕小说生成工具 $tag" --generate-notes
          }
